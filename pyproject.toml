[project]
name = "triggerbot"
version = "0.1.0"
description = "Discord bot that spots a trigger word in voice chat: log-mel features, a small CNN trained on a few dozen examples, cross-session evaluation and a streaming detector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
bot = ["discord.py[voice]>=2.4", "discord-ext-voice-recv>=0.5.2a"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
triggerbot = "triggerbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triggerbot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# daily counters intentionally use the bot host's local date
"src/triggerbot/bot.py" = ["DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
